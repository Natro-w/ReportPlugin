name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Create lib directory
      run: mkdir -p lib

    - name: Download Lumi server JAR
      run: |
        curl -sL -o lib/Lumi-1.6.0.jar \
          "https://github.com/LuminiaDev/Lumi/releases/download/v1.6.0/Lumi-1.6.0.jar"

    - name: Download LuckPerms
      run: |
        curl -sL -o lib/LuckPerms-Nukkit-5.5.55.jar \
          "https://download.luckperms.net/1579/nukkit/LuckPerms-Nukkit-5.5.55.jar"

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml
      env:
        LUMI_PATH: lib/Lumi-1.6.0.jar
        LUCKPERMS_PATH: lib/LuckPerms-Nukkit-5.5.55.jar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReportPlugin
        path: target/ReportPlugin-*.jar

    - name: Attach to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: target/ReportPlugin-*.jar
