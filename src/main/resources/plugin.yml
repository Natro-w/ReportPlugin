name: ReportPlugin
main: ru.Natro.reportplugin.ReportPlugin
version: 1.1.0
api: ["1.0.11", "1.0.13", "1.0.14", "1.0.15"]
author: Natro
description: Advanced report system with Discord support and investigations
depend: ["LuckPerms"]
permissions:
